name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    # Only main goes live (the github-pages environment enforced this before).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Fails if a skill or command has no how-to spec, a spec does not render, or a link is broken.
      - name: Build site
        run: python site/build.py

      - name: Deploy to webbie
        env:
          WEBBIE_DEPLOY_TOKEN: ${{ secrets.WEBBIE_DEPLOY_TOKEN }}
        run: |
          (cd _site && zip -qr "$RUNNER_TEMP/site.zip" .)
          curl -sS --fail-with-body --max-time 300 -X PUT --data-binary @"$RUNNER_TEMP/site.zip" \
            -H "Authorization: Bearer $WEBBIE_DEPLOY_TOKEN" \
            "https://webbie.wovemind.com/deploy/marketplace?message=$GITHUB_SHA"
