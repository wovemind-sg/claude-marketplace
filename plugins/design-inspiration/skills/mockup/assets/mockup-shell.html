<title>{{APP_NAME}} Design Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<!--
  Filling this shell (mockup skill, step 5 "Check before publishing"):
  - Replace every placeholder in double curly braces, including APP_NAME in the title. Escape &, <, > and quotes in text you insert.
  - <header id="meta">: data-shortlist = the shortlist Artifact URL. Copy the shortlist's brief (summary and every dt/dd pair) unchanged.
  - Repeat one tab <button> and one <section class="mock"> per app page, in the same order. data-page = the shortlist's page slug.
    The tab label and the section's h2 are the same app page name: comments are tied to a page by that visible name.
  - data-mode = "restyle" (the real page, restyled) or "redesign" (free redesign). Only a redesign section keeps <ul class="changes">,
    one <li> per structural change; delete the list from restyle sections.
  - {{PAGE_FRAGMENT}} = the builder's fragment for that page: one <style> whose rules all sit inside one nested block
    .mock[data-page="<slug>"] .viewport { ... }, so pages cannot restyle each other, with breakpoints written as
    @container (min-width: ...) queries (the .viewport is the container), then the page markup. The fragment sets its own
    background and colors; it does not follow the viewer's theme.
  - Do not rename the ids, classes or data attributes: the mockup and plan skills read them.
  - Hidden tabs stay in the document (the hidden attribute only hides them), so comments on every page keep their anchor.
-->
<style>
/* Layout: quiet frame around the mockups; sticky bar with page tabs and width switch, the mockup viewport takes the stage. */
:root{
  --bg:#eef0f2; --surface:#ffffff; --fg:#1b1f24; --muted:#5b636d; --line:#d5d9de;
  --accent:#2d4f7c; --accent-bg:#e2e9f3;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121417; --surface:#1b1e23; --fg:#e6e8eb; --muted:#9aa2ad; --line:#2d3239;
  --accent:#9cb8e0; --accent-bg:#1f2a3a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1b1e23; --fg:#e6e8eb; --muted:#9aa2ad; --line:#2d3239;
  --accent:#9cb8e0; --accent-bg:#1f2a3a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body);margin:0;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
main{max-width:1400px;margin:0 auto;display:grid;gap:20px}
h1{font:600 clamp(22px,3.4vw,30px)/1.15 var(--font-body);margin:0;text-wrap:balance}
h2{font:600 20px/1.25 var(--font-body);margin:0;text-wrap:balance}
.eyebrow{font:500 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#meta{display:grid;gap:10px}
#meta .summary{max-width:68ch;margin:0}
#meta details{font-size:14px}
#meta summary{cursor:pointer;color:var(--muted)}
#meta dl{margin:8px 0 0;display:grid;grid-template-columns:minmax(110px,170px) 1fr;border-top:1px solid var(--line)}
#meta dt,#meta dd{padding:8px 0;border-bottom:1px solid var(--line);margin:0;min-width:0;overflow-wrap:anywhere}
#meta dt{color:var(--muted);font-size:13px;padding-right:12px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;padding-block:10px;border-bottom:1px solid var(--line)}
.tabs,.widths{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.bar button{font:500 14px var(--font-body);padding:6px 12px;border-radius:6px;border:1px solid transparent;background:none;color:var(--muted);cursor:pointer}
.bar button:hover{color:var(--fg)}
.bar button[aria-selected="true"],.bar button[aria-pressed="true"]{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.widths{border:1px solid var(--line);border-radius:8px;padding:2px}
.widths button{font-size:13px;padding:4px 10px}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mock{display:grid;gap:14px}
.mock[hidden]{display:none}
.mock-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.mode{font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:2px 8px}
.changes{margin:0;padding-left:20px;max-width:80ch;font-size:14px;color:var(--muted)}
.changes li+li{margin-top:2px}
.stage{display:flex;justify-content:center;min-width:0}
.viewport{container-type:inline-size;container-name:viewport;width:100%;max-width:100%;min-width:0;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
main[data-w="tablet"] .viewport{max-width:820px}
main[data-w="phone"] .viewport{max-width:390px}
.size{font:500 12px var(--font-mono);color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.viewport{transition:max-width .2s ease}}
</style>

<main data-w="desktop">
  <header id="meta" data-shortlist="{{SHORTLIST_URL}}">
    <span class="eyebrow">Design mockup</span>
    <h1>{{APP_NAME}}</h1>
    <p class="summary">{{APP_SUMMARY}}</p>
    <details>
      <summary>Design brief</summary>
      <dl>
        <!-- The shortlist's brief, unchanged: one dt/dd per item. -->
        <dt>{{BRIEF_LABEL}}</dt><dd>{{BRIEF_VALUE}}</dd>
      </dl>
    </details>
  </header>

  <div class="bar">
    <div class="tabs" role="tablist" aria-label="App pages">
      <button type="button" role="tab" id="tab-{{PAGE_SLUG}}" aria-controls="page-{{PAGE_SLUG}}" data-page="{{PAGE_SLUG}}">{{PAGE_NAME}}</button>
    </div>
    <div class="widths" role="group" aria-label="Preview width">
      <button type="button" data-w="desktop">Desktop</button>
      <button type="button" data-w="tablet">Tablet</button>
      <button type="button" data-w="phone">Phone</button>
    </div>
  </div>

  <section class="mock" id="page-{{PAGE_SLUG}}" role="tabpanel" aria-labelledby="tab-{{PAGE_SLUG}}" data-page="{{PAGE_SLUG}}" data-mode="{{PAGE_MODE}}">
    <div class="mock-head">
      <span class="eyebrow">App page</span>
      <h2>{{PAGE_NAME}}</h2>
      <span class="mode">{{PAGE_MODE_LABEL}}</span>
    </div>
    <ul class="changes">
      <li>{{STRUCTURAL_CHANGE}}</li>
    </ul>
    <div class="stage"><div class="viewport">
{{PAGE_FRAGMENT}}
    </div></div>
    <p class="size" aria-live="polite"></p>
  </section>
</main>

<script>
(function(){
// Per-viewer convenience only: last tab and width live in this browser.
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var main=document.querySelector("main");
var tabs=[].slice.call(document.querySelectorAll('.tabs [role="tab"]'));
var secs=[].slice.call(document.querySelectorAll("section.mock[data-page]"));
var wbs=[].slice.call(document.querySelectorAll(".widths button"));
function show(p){
  if(!secs.some(function(s){return s.dataset.page===p}))p=secs[0]&&secs[0].dataset.page;
  secs.forEach(function(s){s.hidden=s.dataset.page!==p});
  tabs.forEach(function(t){var on=t.dataset.page===p;t.setAttribute("aria-selected",String(on));t.tabIndex=on?0:-1});
  if(p)put("dm-tab",p);sizes();
}
function width(w){
  if(["desktop","tablet","phone"].indexOf(w)<0)w="desktop";
  main.dataset.w=w;wbs.forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.w===w))});
  put("dm-width",w);setTimeout(sizes,250);
}
function sizes(){secs.forEach(function(s){if(!s.hidden)s.querySelector(".size").textContent=Math.round(s.querySelector(".viewport").clientWidth)+" px wide"})}
tabs.forEach(function(t,i){
  t.onclick=function(){show(t.dataset.page)};
  t.onkeydown=function(e){var d=e.key==="ArrowRight"?1:e.key==="ArrowLeft"?-1:0;if(!d)return;var n=tabs[(i+d+tabs.length)%tabs.length];n.focus();show(n.dataset.page)};
});
wbs.forEach(function(b){b.onclick=function(){width(b.dataset.w)}});
window.addEventListener("resize",sizes);
show(get("dm-tab"));width(get("dm-width"));
})();
</script>
